<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MODGAMEAIGAME</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chonburi&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --line: #33473A;
  --line-soft: #2A3B31;
  --ink: #ECE6D6;
  --muted: #90A797;
  --muted-2: #63776A;
  --blaze: #026d99;
  --blaze-dim: #E1652C33;
  --moss: #86AE68;
  --moss-dim: #86AE6822;
  --amber: #D9A441;
  --amber-dim: #D9A44133;
  --radius: 14px;
  --radius-sm: 8px;
  --danger: #e64545;
  --danger-dim: #e6454522;
  --bg: #101B15;
  --panel: #14221A;
}

* { box-sizing: border-box; }

/* ---------- พื้นหลังหลัก ---------- */

/* เลเยอร์รูปภาพพื้นหลัง + เอฟเฟกต์เคลื่อนไหว */
body::before {
  content: "";
  position: fixed;
  inset: -5%;
  z-index: -2;
  background-image: 
    radial-gradient(circle at 50% 50%, rgba(16, 27, 21, 0.45) 0%, rgba(12, 20, 15, 0.85) 100%),
    linear-gradient(to bottom, rgba(16, 27, 21, 0.3), rgba(12, 20, 15, 0.3)),
    url('https://media4.giphy.com/media/v1.Y2lkPTc5MGI3NjExazNhNTR6dWNndzk2NjBsNDhjNnJwajJhbDh6dmIyM3hkOHBoOTU3aCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/wIT0tVg65MNFII7dWI/giphy.gif');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  animation: bgPulseZoom 20s ease-in-out infinite alternate;
}

/* เลเยอร์แสง HUD เรืองแสง */
body::after {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: 
    radial-gradient(circle at 20% 20%, var(--blaze-dim) 0%, transparent 40%),
    radial-gradient(circle at 80% 80%, var(--moss-dim) 0%, transparent 40%);
  animation: glowShift 10s ease-in-out infinite alternate;
}

@keyframes bgPulseZoom {
  0% { transform: scale(1) rotate(0deg); }
  100% { transform: scale(1.08) rotate(0.5deg); }
}

@keyframes glowShift {
  0% { opacity: 0.5; transform: translateY(0px); }
  50% { opacity: 0.8; }
  100% { opacity: 0.5; transform: translateY(-20px); }
}

/* Container และหัวข้อ */
.checker-container {
  max-width: 900px;
  margin: 0 auto;
  padding: 1rem;
}

.checker-title {
  color: rgb(236, 230, 214);
  font-size: 1.25rem;
  margin-bottom: 1rem;
  border-bottom: 1px solid rgba(42, 61, 49, 0.8);
  padding-bottom: 0.5rem;
}

/* รายการแต่ละแถว (Row) */
.checker-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.checker-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 16px;
  background: rgba(20, 34, 26, 0.6);
  border: 1px solid rgba(42, 61, 49, 0.8);
  border-radius: var(--radius-sm, 8px);
  backdrop-filter: blur(4px);
  transition: all 0.2s ease;
}

.checker-item:hover {
  border-color: rgba(134, 174, 104, 0.5);
  background: rgba(20, 34, 26, 0.85);
}

.checker-left {
  display: flex;
  align-items: center;
  gap: 14px;
}

.checker-icon {
  width: 42px;
  height: 42px;
  border-radius: 6px;
  object-fit: cover;
  background: rgba(8, 13, 9, 0.8);
  border: 1px solid rgba(144, 167, 151, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  color: rgb(134, 174, 104);
}

.checker-info {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.checker-name {
  font-weight: 600;
  font-size: 1rem;
  color: rgb(236, 230, 214);
}

.checker-eng {
  font-size: 0.8rem;
  color: rgb(144, 167, 151);
}

.checker-right {
  display: flex;
  align-items: center;
  gap: 10px;
}

::selection { background: var(--blaze-dim); color: var(--ink); }
a { color: var(--blaze); }

.scan-overlay {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 60;
  mix-blend-mode: overlay;
  background: repeating-linear-gradient(
    to bottom,
    rgba(255,255,255,0.05) 0px,
    rgba(255,255,255,0.05) 1px,
    transparent 1px,
    transparent 3px
  );
}
.hud-frame { position: relative; }
.hud-frame::before, .hud-frame::after {
  content: "";
  position: absolute;
  width: 16px; height: 16px;
  border: 1.5px solid var(--blaze);
  opacity: .5;
  pointer-events: none;
}
.hud-frame::before { top: -1px; left: -1px; border-right: none; border-bottom: none; }
.hud-frame::after { bottom: -1px; right: -1px; border-left: none; border-top: none; }

.wrap {
  max-width: 1040px;
  margin: 0 auto;
  padding: 40px 24px 80px;
}

header {
  position: relative;
  padding: 28px 0 34px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 34px;
}

h1 {
  font-family: 'Chonburi', 'IBM Plex Sans Thai', serif;
  font-weight: 400;
  font-size: clamp(32px, 5vw, 46px);
  line-height: 1.15;
  margin: 0 0 10px;
  color: var(--ink);
}

.dropzone {
  border: 1.5px dashed var(--line);
  border-radius: var(--radius);
  background: linear-gradient(180deg, #16221B 0%, #131E17 100%);
  padding: 46px 28px;
  text-align: center;
  cursor: pointer;
  position: relative;
}

.btn {
  font-family: 'IBM Plex Sans Thai';
  font-weight: 600;
  font-size: 13.5px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
  transition: border-color .15s ease, background .15s ease, transform .1s ease;
}
.btn:hover { border-color: var(--muted); background: #ffffff08; }
.btn:active { transform: scale(0.97); }

.btn.primary {
  background: var(--blaze);
  border-color: var(--blaze);
  color: #17110C;
  transition: background-color 0.2s ease, border-color 0.2s ease;
}

.btn.primary.released {
  background: var(--moss);
  border-color: var(--moss);
  color: #17110C;
}

.btn.primary.in-progress {
  background: var(--amber);
  border-color: var(--amber);
  color: #17110C;
}

.btn.primary.not-working {
  background: var(--danger);
  border-color: var(--danger);
  color: #17110C;
}

.btn.primary:hover {
  background: linear-gradient(135deg, #ff0055, #9d00ff, #ff6600, #ccff00, #ff0055);
  background-size: 300% 300%;
  border-color: transparent;
  color: #ffffff;
  font-weight: 600;
  text-shadow: 0 0 8px rgba(255, 255, 255, 0.9), 0 0 15px rgba(255, 0, 85, 0.8);
  box-shadow: 0 0 18px rgba(255, 0, 85, 0.7), 0 0 35px rgba(157, 0, 255, 0.8);
  animation: rgbShift 2s linear infinite;
  filter: brightness(1.25);
  transform: translateY(-2px);
}

@keyframes rgbShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* ---------- Badge Version RGB Animated ---------- */
.game-badge.version-rgb {
  font-size: 0.75rem;
  font-weight: 600;
  color: #ffffff;
  background: linear-gradient(135deg, rgba(255,0,85,0.25), rgba(122,0,255,0.25), rgba(0,229,255,0.25), rgba(0,255,102,0.25), rgba(255,0,85,0.25));
  background-size: 300% 300%;
  border: 1px solid rgba(0, 229, 255, 0.6);
  box-shadow: 0 0 8px rgba(0, 229, 255, 0.3);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  animation: rgbBadgeShift 4s linear infinite;
}

@keyframes rgbBadgeShift {
  0% { background-position: 0% 50%; border-color: #ff0055; box-shadow: 0 0 8px rgba(255, 0, 85, 0.4); }
  25% { border-color: #7a00ff; box-shadow: 0 0 8px rgba(122, 0, 255, 0.4); }
  50% { background-position: 100% 50%; border-color: #00e5ff; box-shadow: 0 0 8px rgba(0, 229, 255, 0.4); }
  75% { border-color: #00ff66; box-shadow: 0 0 8px rgba(0, 255, 102, 0.4); }
  100% { background-position: 0% 50%; border-color: #ff0055; box-shadow: 0 0 8px rgba(255, 0, 85, 0.4); }
}

.field-note {
  margin-top: 26px;
  border-left: 2px solid var(--blaze);
  padding: 4px 16px;
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.7;
}
.field-note b { color: var(--ink); font-weight: 600; }

.nav-tabs {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 22px;
}
.nav-tabs .btn.tab.active {
  background: var(--blaze);
  border-color: var(--blaze);
  color: #17110C;
}

.view { display: none; }
.view.show { display: block; animation: fadein .35s ease both; }
@keyframes fadein { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

.section-title {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.16em;
  text-transform: uppercase; color: var(--muted-2); margin: 0 0 16px;
}
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 18px;
}
.game-card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 20px 18px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.game-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.game-card-eng {
  font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--muted-2);
}
.game-card h2 {
  font-family: 'IBM Plex Sans Thai'; font-weight: 600; font-size: 17px; margin: 2px 0 0; color: var(--ink);
}
.game-badge {
  font-family: 'IBM Plex Mono', monospace; font-size: 14px; letter-spacing: 0.05em;
  padding: 3px 9px; border-radius: 999px; white-space: nowrap; flex-shrink: 0;
  border: 1px solid var(--line-soft);
}
.game-badge.released, .game-badge.working { color: var(--moss); border-color: var(--moss-dim); background: var(--moss-dim); }
.game-badge.in-progress, .game-badge.updating { color: var(--amber); border-color: var(--amber-dim); background: var(--amber-dim); }
.game-badge.not-working { color: var(--danger); border-color: var(--danger-dim); background: var(--danger-dim); }

.game-card p.note { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0; flex: 1; }
.game-stats {
  display: flex; gap: 14px; flex-wrap: wrap;
  font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted-2);
}
.game-stats b { color: var(--ink); font-weight: 600; }
.game-card-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.game-status-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 6px; }
.game-status-dot.released, .game-status-dot.working { background: var(--moss); }
.game-status-dot.in-progress, .game-status-dot.updating { background: var(--amber); }
.game-status-dot.not-working { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.home-empty { padding: 40px 0; color: var(--muted); font-size: 13.5px; text-align: center; }
</style>
</head>
<body>
<div class="scan-overlay" aria-hidden="true"></div>
<div class="wrap">

  <header>
    <h1>AI-FREE</h1>
    <div class="nav-tabs">
      <button class="btn tab active" id="tabHome" type="button">โปรเจกต์ทั้งหมด</button>
      <button class="btn tab" id="tabChecker" type="button">เช็คสถานะ</button>
    </div>
  </header>

  <div class="view show" id="view-home">
    <div class="section-title">โปรเจกต์ทั้งหมด</div>
    <div class="game-grid" id="gameGrid"></div>
    <div class="home-empty" id="homeEmpty" style="display:none;"></div>
    <div class="field-note">
      <b>สถานะ —</b>
       🟢ปกติ  
       🟠กําลังอัปเดต~เเก้ไข  
       🔴ใช้งานไม่ได้
    </div>
  </div>

  <div class="view" id="view-checker">
    <div class="checker-container">
      <h2 class="checker-title">รายการเช็คสถานะ (Status Checker)</h2>
      <div class="checker-list" id="checkerList"></div>
    </div>
  </div>

</div>

<script>
// ข้อมูลโปรเจกต์ทั้งหมด (รวมตัวแปร GAMES ไว้ที่เดียว)
const GAMES = [
  {
    modTitle: "MeowMenu AI",
    name: "MeowMenu:AI",
    type: "BOT",
    status: "released",
    version: "0.0.1",
    downloadUrl: "https://www.mediafire.com/file/cw742bcbgt4lhzu/Meow.rar/file",
    downloadLabel: "Mediafire",
    updated: "2026-10-10",
    note: "BOT GAME FREE ระบบ Menu การศึกษา เเละ ความรู้ ไม่มี ไวร้ส หรือ Malware เป็นเเค่ BOT โปรเเกรมจําลองรองรับ LDPlayer | NoxPlayer | BlueStacks เข้าใช้งานเเละเทส KEY : KEYAUTH-uHTRoZ-7UnwQd "
  },
  {
    modTitle: "かわいい猫 AI",
    name: "かわいい猫:AI",
    type: "BOT",
    status: "released",
    version: "0.1.0",
    downloadUrl: "https://www.mediafire.com/file/8eurl30b5z40x7f/%25E3%2581%258B%25E3%2582%258F%25E3%2581%2584%25E3%2581%2584%25E7%258C%25AB.rar/file",
    downloadLabel: "Mediafire",
    updated: "2024-9-16",
    note: "BOT GAME FREE ระบบ Console การศึกษา เเละ ความรู้ ไม่มี ไวร้ส หรือ Malware เป็นเเค่ BOT โปรเเกรมจําลองรองรับ NoxPlayer 32game เข้าใช้งานเเละเทส KEY : KEYAUTH-uHTRoZ-7UnwQd "
  }
];

const STATUS_LABEL = { 
  released: 'ปกติ', 
  'in-progress': 'กําลังอัปเดตเเก้ไข', 
  'not-working': 'ใช้งานไม่ได้',
  working: 'ใช้งานได้',
  updating: 'กำลังอัปเดต'
};

// 1. ฟังก์ชันเรนเดอร์หน้า Status Checker
function renderCheckerList() {
  const checkerList = document.getElementById('checkerList');
  if (!checkerList) return;

  if (!GAMES || !GAMES.length) {
    checkerList.innerHTML = '<div style="color: rgb(144, 167, 151);">ไม่มีข้อมูลรายการเช็คสถานะ</div>';
    return;
  }

  checkerList.innerHTML = GAMES.map(game => {
    const statusKey = STATUS_LABEL[game.status] ? game.status : 'released';
    const statusLabel = STATUS_LABEL[statusKey] || 'ปกติ';

    const iconHtml = game.img 
      ? `<img src="${game.img}" alt="${game.modTitle || ''}" class="checker-icon">`
      : `<div class="checker-icon">🎮</div>`;

    return `
      <div class="checker-item">
        <div class="checker-left">
          ${iconHtml}
          <div class="checker-info">
            <span class="checker-name">${game.modTitle || game.name || 'ไม่มีชื่อม็อด'}</span>
            <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
              ${game.name ? `<span class="checker-eng">${game.name}</span>` : ''}
              ${game.type ? `<span style="font-size: 0.75rem; color: var(--blaze); background: var(--blaze-dim); padding: 1px 6px; border-radius: 4px;">${game.type}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="checker-right">
          ${game.version ? `<span class="game-badge version-rgb">v${game.version}</span>` : ''}
          <span class="game-badge ${statusKey}">${statusLabel}</span>
        </div>
      </div>
    `;
  }).join('');
}

// 2. ฟังก์ชันเรนเดอร์หน้าโปรเจกต์หลัก (Home) - แสดงทั้ง type และ updated
function renderGameGrid() {
  const grid = document.getElementById('gameGrid');
  const empty = document.getElementById('homeEmpty');
  if (!grid) return;

  if (!GAMES.length) {
    empty.style.display = 'block';
    empty.textContent = 'ยังไม่มีข้อมูลเกม';
    return;
  }

  grid.innerHTML = GAMES.map(game => {
    const statusKey = STATUS_LABEL[game.status] ? game.status : 'released';
    const statusLabel = STATUS_LABEL[statusKey] || 'ปกติ';

    // แสดงทั้ง type และ updated
    let statsHtml = `
      <div class="game-stats" style="display: flex; flex-direction: column; gap: 4px;">
        ${game.type ? `<span>ประเภท: <b>${game.type}</b></span>` : ''}
        <span><span class="game-status-dot ${statusKey}"></span>อัปเดตล่าสุด <b>${game.updated || '—'}</b></span>
      </div>
    `;    

    let actionsHtml = '';
    if (game.downloadUrl) {
      actionsHtml += `<a class="btn primary ${statusKey}" href="${game.downloadUrl}" target="_blank" rel="noopener">ดาวน์โหลด${game.downloadLabel ? ' · ' + game.downloadLabel : ''}</a>`;
    }

    return `
      <div class="game-card hud-frame">
        <div class="game-card-top">
          <div>
            <div class="game-card-eng">${game.name || ''}</div>
            <h2>${game.modTitle || game.name}</h2>
          </div>
          <div style="text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px;">
            <span class="game-badge ${statusKey}">${statusLabel}</span>
            ${game.version ? `<span class="game-badge version-rgb">v${game.version}</span>` : ''}
          </div>
        </div>
        <p class="note">${game.note || ''}</p>
        ${statsHtml}
        <div class="game-card-actions">${actionsHtml}</div>
      </div>
    `;
  }).join('');
}

// ระบบสลับหน้า (Tabs)
const tabHome = document.getElementById('tabHome');
const tabChecker = document.getElementById('tabChecker');
const viewHome = document.getElementById('view-home');
const viewChecker = document.getElementById('view-checker');

function showView(name){
  const home = name === 'home';
  viewHome.classList.toggle('show', home);
  viewChecker.classList.toggle('show', !home);
  tabHome.classList.toggle('active', home);
  tabChecker.classList.toggle('active', !home);
}

tabHome.addEventListener('click', () => showView('home'));
tabChecker.addEventListener('click', () => showView('checker'));

renderGameGrid();
renderCheckerList();
</script>
</body>
</html>
